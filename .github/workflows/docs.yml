name: Deploy Cargo Doc

on:
  push:
    branches: ["main"] # Убедитесь, что ваша основная ветка называется main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Documentation
        run: cargo doc --no-deps --all-features

      - name: Remove lock file
        run: rm -f ./target/doc/.lock

      - name: Create redirect to crate docs
        run: |
          cat <<EOF > ./target/doc/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Redirecting to locknet_rcab</title>
              <meta http-equiv="refresh" content="0; URL=locknet_rcab/index.html">
              <link rel="canonical" href="locknet_rcab/index.html">
          </head>
          <body>
              <p>If you are not redirected automatically, follow this <a href="locknet_rcab/index.html">link</a>.</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './target/doc' # Указываем нашу папку

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4