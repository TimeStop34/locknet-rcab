[package]
name = "locknet-rcab"
version = "1.0.0-beta"
edition = "2021"
rust-version = "1.75"
description = "LockNet Rust Client-API Binding"
license = "AGPL-3.0-only"
repository = "https://github.com/TimeStop34/locknet-rcab"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
url = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
vodozemac = "0.8"
getrandom = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
crypto_secretbox = "0.1"
async-trait = "0.1.92"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"], optional = true }
subtle = "2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
vodozemac = "0.8"

[features]
default = []
sqlite = ["dep:rusqlite"]

[[test]]
name = "sqlite_store"
required-features = ["sqlite"]

[[test]]
name = "sqlite_e2e"
required-features = ["sqlite"]

[[example]]
name = "persistent_login"
required-features = ["sqlite"]